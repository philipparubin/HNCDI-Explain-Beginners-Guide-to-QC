[project]
name = "hncdi-explain-beginners-guide-to-qc"
version = "0.1.0"
description = "Materials for HNCDI Explain Courses"
authors = [{ name = "Philippa Rubin", email = "philippa.rubin@stfc.ac.uk" }]
requires-python = ">=3.10,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=1.23.0,<2",
    "matplotlib>=3.6.3,<4",
    "jupyter>=1.0.0,<2",
    "jupyterlab>=3.6.1,<4",
]

[dependency-groups]
dev = ["ipykernel>=6.29.4,<7"]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-name = ["hncdi_explain_beginners_guide_to_qc"]
module-root = ""
namespace = true

[build-system]
requires = ["uv_build>=0.9.4,<0.10.0"]
build-backend = "uv_build"
